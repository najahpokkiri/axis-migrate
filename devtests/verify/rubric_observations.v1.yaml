fixed_plot_blind:
- "L5 bilinear: all four worst tiles landed on the valid-mask edge (one-side cells ranked first, ties by row), so the smoothing of the peaks was never at native resolution; plot.py now alternates tiles between the largest |d| and the densest one-side clusters"
- "L7 / T1b: differences on zone boundaries could not be attributed to zones; plot.py now draws the declared zone boundaries (graph compare.zones) on diff, mask_diff and tiles, and rings over-tolerance cells in the overview when there are at most 600"
- "T1b: the saturated ends of PuOr are near-black and read as 'valid in legacy only' (black); the diff colormap is now PuOr_r truncated to [0.12, 0.88]"
- "L7b / L5: a one-cell one-side ring along the outer edge was ~1 px at full extent and hidden under the zone line; one-side cells are now outlined thickly above the zone lines in mask_diff and the overview diff"
- "per-feature: tiny non-zero symdiff/attribute differences were binned as 'equal' (white) and small features vanished; white is now exact zero only and features are drawn with coloured edges"
observed_at: '2026-10-13'
reviewer: claude-opus-5-5 (plot.py builder; opened each cited PNG)
