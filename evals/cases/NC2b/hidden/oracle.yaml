default: recommended
rules:
  - match: "canton|name|manual"
    unless: "confirm all|approve|plan|target"
    max_uses: 1
    answer: "Drop the 'Canton ' prefix from shapeName; one exception: Canton Esch-sur-Alzette becomes Esch/Alzette, as in the xlsx. Do it in code."
  - match: "MIN_AREA|minimum area|area threshold"
    unless: "confirm all|approve|plan"
    max_uses: 1
    answer: "5000"
