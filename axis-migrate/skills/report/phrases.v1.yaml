# phrases.v1.yaml — the only source of verdict wording in the report (07 D7-8, §4.2).
# Key = reason code; value = template filled from the failing check (value, threshold, metric, unit, tolerance_id,
# diagnostics.* flattened, e.g. {shift_px[0]}). Missing numbers render as "?". An unknown code is shown literally
# and flagged PHRASE_MISSING; it is never dropped. British English. No claims beyond the code's meaning.
version: 1
phrases:
  # --- contract / pairing (06 §3.1)
  OUTPUT_MISSING: "the new output was not produced"
  OUTPUT_UNREADABLE: "the new output cannot be read"
  OUTPUT_EMPTY: "the new output is empty"
  OUTPUT_NOT_PRODUCED_BY_RUN: "the output is not in the step's write ledger (not produced by this run)"
  LINEAGE_MISMATCH: "the output was written by a different step than the graph says"
  UNPAIRED_LEGACY: "a legacy output has no new counterpart"
  UNPAIRED_NEW: "a new output has no legacy counterpart"
  PAIRING_UNCONFIRMED: "the legacy file is not confirmed as this step's output"
  NO_REFERENCE: "no legacy reference exists for this output"
  LAYER_AMBIGUOUS: "the legacy file has several layers and none is declared"
  KEY_UNDECLARED: "no key or geometry matching rule is declared"
  FAMILY_UNSUPPORTED: "this data family cannot be compared yet"
  GATED: "not compared because a structural check failed first"
  UPSTREAM_BLOCKED: "not compared because an upstream step did not run"
  ISOLATION_INPUT_UNAVAILABLE: "the isolated run had no legacy copy of an input"
  BRIDGED: "bridged: the legacy artefact is used, so it is never compared against itself"
  WAIVED: "comparison waived by a person"
  NOT_COMPARED: "a legacy reference exists but no comparison was made"
  # --- structure
  CRS_MISSING: "a CRS is missing on one side"
  CRS_MISMATCH: "the coordinate reference systems differ"
  RASTER_BAND_COUNT_MISMATCH: "band count differs ({value} vs expected)"
  RASTER_SHAPE_MISMATCH: "raster shape differs ({value})"
  # shift_px = [(c_new − c_legacy)/a, (f_new − f_legacy)/e]; e < 0 on north-up grids, so +y pixels = south
  RASTER_TRANSFORM_MISMATCH: "grid shifted by {shift_px[0]} px east, {shift_px[1]} px south (negative = west / north; deviation {value} px, limit {threshold} px)"
  DTYPE_MISMATCH: "data type differs"
  NODATA_VALUE_MISMATCH: "NoData value differs"
  NODATA_MASK_MISMATCH: "{value} cells are valid on one side only (limit {threshold})"
  SCHEMA_MISMATCH: "columns differ"
  GEOMETRY_TYPE_MISMATCH: "geometry type differs"
  GEOMETRY_INVALID: "the new output has more invalid geometries"
  FEATURE_COUNT_MISMATCH: "feature count differs ({value})"
  ROW_COUNT_MISMATCH: "row count differs ({value})"
  KEY_DUPLICATE: "duplicate keys"
  KEY_SET_MISSING: "keys present in legacy are missing in new ({value})"
  KEY_SET_EXTRA: "keys present in new are missing in legacy ({value})"
  # --- values
  RASTER_VALUE_MISMATCH: "{value} cells differ beyond the tolerance (max |Δ| {max_abs} {unit})"
  RASTER_CATEGORY_MISMATCH: "class values differ in {value} cells"
  RASTER_NON_INTEGER_COUNTS: "counts have fractional values"
  NULL_PATTERN_MISMATCH: "empty values sit in different places"
  ATTRIBUTE_VALUE_MISMATCH: "attribute values differ ({value})"
  GEOMETRY_SYMDIFF_EXCEEDED: "geometries differ: symmetric difference ratio {value} (limit {threshold})"
  GEOMETRY_HAUSDORFF_EXCEEDED: "geometries differ: Hausdorff distance {value} m (limit {threshold} m)"
  GEOMETRY_MEASURE_CRS_INVALID: "geometry was to be measured in degrees or Web Mercator; set a metric CRS"
  # --- conservation
  TOTAL_DRIFT: "the total differs (relative drift {value})"
  ZONE_TOTAL_DRIFT: "per-zone totals differ (max relative drift {value})"
  INVARIANT_VIOLATED: "an invariant of the workflow does not hold in the new output"
  # --- diagnostics (never a verdict on their own)
  NUMERIC_SCALE_FACTOR: "values look scaled by a power of ten (k = {k})"
  NUMERIC_OFFSET: "values look offset by a constant"
  NUMERIC_SIGN_FLIP: "values look sign-flipped"
  DATA_OFFSET_SUSPECTED: "data look shifted by whole cells while the grid is right"
  SMOOTHING_SUSPECTED: "the new values look smoothed"
  ACCUMULATED_UPSTREAM_DIFFERENCE: "upstream differences within tolerance add up here"
  COMPENSATING_DEFECT: "the step fails in isolation but passes chained: two errors cancel"
  CANDIDATE_IDENTICAL_TO_REFERENCE: "the new file is byte-identical to the legacy file (diagnostic)"
  NULL_JOIN_INCREASE: "more unmatched join rows than legacy (diagnostic)"
  VERTEX_COUNT_DROP: "fewer vertices than legacy (diagnostic)"
  # --- review / decision
  OPEN_QUESTION: "open question {id} ({kind}) on {node}: {header}"
  PLAN_APPROVED_BY_STANDING_INSTRUCTION: "plan approved by standing instruction (steps: {steps}), not by the user on a shown plan.md"
  VISUAL_FLAG: "flagged in the visual review; a person must look"
  VISUAL_REVIEW_MISSING: "no visual review receipt cites this run's plots"
  BRANCH_NOT_EXERCISED: "a code branch has no legacy output to check against"
  LEGACY_DEFECT_SUSPECTED: "the legacy output itself looks wrong; the owner must decide keep or fix"
  TOLERANCE_UNSIGNED: "differs within a proposed tolerance that has not been signed; sign it in migration/SIGN-OFF.md or fix the code"
  KD_UNSIGNED: "a proposed known difference would cover this, but no person has accepted it; accept it in migration/SIGN-OFF.md or fix the code"
  # --- change control / evaluator
  TOLERANCE_CHANGED_AFTER_RUN: "tolerances.yaml changed after this run"
  PARAMS_CHANGED_AFTER_RUN: "params.yaml changed after this run"
  GRAPH_CHANGED_AFTER_RUN: "graph.json changed after this run"
  LOCK_CHANGED_AFTER_RUN: "the environment lock changed after this run"
  CODE_CHANGED_AFTER_RUN: "the pipeline code changed after this run; this report describes the sealed code"
  DECISIONS_CHANGED_AFTER_RUN: "decisions.md has entries newer than this run (they apply from the next run)"
  KNOWN_DIFFERENCES_CHANGED_AFTER_RUN: "known-differences.md has entries newer than this run (they apply from the next run)"
  TOLERANCE_UNJUSTIFIED: "a tolerance record lacks its two measured numbers; the check ran exact"
  OUTPUT_CHANGED_BY_OPTIMISATION: "an optimisation changed the output"
  REFERENCE_HASH_MISMATCH: "the legacy reference changed since discovery"
  INPUT_HASH_MISMATCH: "an input differs from the inventory"
  CHECKER_HASH_MISMATCH: "the comparator code differs from the pinned version"
  CHECKER_EXCEPTION: "the comparator raised an error"
  REFERENCE_NOT_INDEPENDENT: "the reference is not independent of the new output"
  # --- evidence and ladder (07)
  EVIDENCE_FILE_MISSING: "an evidence file is missing"
  EVIDENCE_HASH_MISMATCH: "an evidence file changed after sealing"
  EVIDENCE_SCHEMA_INVALID: "the evidence index is not valid"
  EVIDENCE_ID_MISMATCH: "the evidence id does not match the sealed index"
  EVIDENCE_CHAIN_BROKEN: "an amendment changed sealed content"
  EVIDENCE_INCOMPLETE: "evidence incomplete"
  STATE_RECOMPUTE_MISMATCH: "the stored verdict does not follow from its own checks"
  UNBOUND_COMPARE: "the comparison is not bound to this run's output, reference and tolerances"
  LEGACY_REF_CHANGED: "the legacy folder changed after discovery"
  SECRET_IN_BUNDLE: "the secret scan matched a file in the bundle"
  RECORDS_PARSE_MISMATCH: "the sealed parameter/decision records do not match the sealed files"
  PARAM_FITTED_TO_REFERENCE: "a parameter was fitted to the legacy reference without a passing hold-out"
  PARAM_FITTED_NOT_CONFIRMED: "a fitted parameter has not been confirmed by a person"
  ASSUMED_PARITY_BLIND: "an assumed parameter changes an output in a way the legacy comparison cannot detect; a person must confirm it (capped at sandbox-validated)"
  UPSTREAM_NOT_VERIFIED: "an upstream step is not verified"
  TARGET_ENV_DIVERGES: "the target environment differs from the verified lock"
  PHRASE_MISSING: "no phrase for this reason code"
  NOTHING_VERIFIED: "nothing was compared, so nothing is verified"
  FINAL_NOT_VERIFIED: "a final output is not verified"
  NO_SEALED_RUN: "no sealed run: nothing verified"
  NO_STEPS_IN_SCOPE: "no step is in scope"
  RUN_NOT_FULL: "the run was not a full chained run of every in-scope step"
  RUN_NOT_CHAINED: "an isolated run cannot support sandbox-validated"
  MODULE_MISSING: "the step module is not in the sealed code"
  NOT_PORTED: "the step has not been ported"
  SCAN_MISSING: "no code-scanner result for this run"
  STEP_NOT_RUN: "the step did not run"
  STEP_NOT_SUCCEEDED: "the step did not finish successfully"
  OUTPUT_NOT_HASHED: "a declared output has no hash in the bundle"
  TESTS_FAILED: "smoke tests failed"
  TESTS_MISSING: "no smoke-test result for this run"
  STUB_CHECK_MISSING: "no stub check recorded"
  CODE_CHANGED_DURING_RUN: "the code changed while the run was in progress"
  EXECUTOR_NOT_RECORDED: "the executor is not recorded"
  READ_LEDGER_WEAK: "the read ledger is audit-only or unknown (no strace, locally or in the sandbox); capped at sandbox-validated"
  DISPOSITION_FAILED: "a compared output fails"
  DISPOSITION_NEEDS_REVIEW: "a person must review an output"
  DISPOSITION_NEEDS_DECISION: "a person must decide"
  DISPOSITION_NOT_COMPARED: "an output with a legacy reference was not compared"
  DISPOSITION_BLOCKED: "a comparison was blocked"
  DISPOSITION_EVALUATOR_ERROR: "the evaluator could not decide"
  DISPOSITION_NO_REFERENCE: "no output of this step has a legacy reference"
  DISPOSITION_EVIDENCE_INCOMPLETE: "evidence for this step is incomplete"
  # --- run and guard (05, 08)
  INPUT_MISSING: "an input is missing; the run stopped"
  UNDECLARED_READ: "the step read a file it did not declare"
  STUB_DETECTED: "a stubbed library was detected"
  STEP_CALLED_EXIT: "the step called exit"
  SCAN_BLOCKED: "the code scanner blocked this step"
  UNLEDGERED_RUN: "the pipeline ran outside the runner"
  CLAIM_ABOVE_RUNG: "a claim went beyond the computed status"
  # --- target (09 §4.1)
  TARGET_NOT_PREPARED: "no target bundle yet (not attempted)"
  TARGET_NOT_SEALED: "the target bundle is not sealed into the evidence"
  TARGET_NOT_BOUND: "the target bundle is not bound to this run's code, params and lock"
  TARGET_CHANGED_AFTER_SEAL: "the target bundle changed after it was sealed"
  TARGET_CHECK_NOT_PASS: "a required target check did not pass"
  TARGET_CHECK_NOT_RUN: "a target check was not run"
  TC_DEPLOYMENT_STATUS_INVALID: "the target manifest does not say not_deployed"
  PIPELINE_NOT_REFERENCE_VERIFIED: "the pipeline is not reference-verified"
  TARGET_NOT_SUPPORTED: "this target platform is not supported"
  TC_SCHEMA_INVALID: "the bundle file does not match the Databricks bundle schema"
  TC_TASK_GRAPH_MISMATCH: "the job's tasks do not match the verified graph"
  TC_VOLUME_UNSAFE_WRITE: "code writes to a Volume in a way Volumes do not support"
  TC_VOLUME_UNSAFE_READ: "code reads from a Volume in a way Volumes do not support"
  TC_DUNDER_FILE: "code uses __file__"
  TC_LOCAL_PATH_LITERAL: "code contains a local path"
  TC_RUNTIME_PIP: "code installs packages at run time"
  TC_DENIED_IMPORT: "code imports a library the runtime does not allow"
  TC_RUNTIME_MANIFEST_MISSING: "the runtime manifest is missing"
  TC_DRYRUN_TASK_FAILED: "a task failed in the dry run"
  TC_DRYRUN_PARITY_FAIL: "dry-run outputs do not match the legacy reference"
  TC_CODE_CHANGED_SINCE_VERIFY: "the code changed since the verified run"
  TC_PARAMS_CHANGED: "params changed since the verified run"
  TC_IDENTIFIER_IN_BUNDLE: "the bundle contains a host, token or other identifier"
  TC_MEMORY_BUDGET: "peak memory is close to the node budget (warning)"
  TC_PRINT_NOT_LOGGED: "pipeline modules print instead of logging (warning)"
  TC_SEEK_ON_VOLUME: "a write seeks on the Volume"
  TC_SQLITE_ON_VOLUME: "SQLite is opened read-write on the Volume"

# --- why a dataset has no legacy reference (graph no_reference_reason; discover/lineage.py, graph.py
# declare_no_reference). Not reason codes: an unknown reason is shown in brackets as written, never PHRASE_MISSING.
no_reference_reasons:
  unused: "no step reads or writes this file"
  orphan_legacy_file: "a legacy file no step writes"
  superseded_only: "only a superseded implementation uses this file"
  display_only: "used only for display (a map style or project), not by the computation"
  doc_only: "named only in documentation"
  version_of_shared_file: "another version of a file a step already shares"
  declared_by_user: "a person declared it has no reference"

# --- plain words for the report's hero (what the computed rung means; never a claim beyond it)
rungs:
  none: "Nothing is established yet. No rung was computed for this run."
  generated: "The new step code exists and passed the code scanner. This run does not show that every step ran cleanly in one chained run, and nothing is confirmed against the legacy outputs."
  sandbox-validated: "The new pipeline ran end to end in one chained run: every step succeeded, read only what it declared, passed its smoke tests, and its outputs are hashed. That says nothing yet about matching the legacy outputs; what stands between this run and reference-verified is listed below."
  reference-verified: "In one full chained run, every in-scope output matches its legacy reference, exactly or within a tolerance a person signed, with a strong record of what each step read."
  target-ready: "Reference-verified, and the job files for the target platform were generated and checked offline. Nothing was deployed and nothing ran on the target."
headlines:
  EVIDENCE INCOMPLETE: "The evidence for this run is incomplete or was changed after sealing, so no rung is shown. The red bar lists what is wrong."
  NOTHING VERIFIED: "Nothing was compared with a legacy reference, so nothing is verified, whatever ran."
  NO SEALED RUN: "No run has been sealed yet, so nothing is verified."
next_rung:
  none: "a sealed, complete evidence bundle"
  generated: "every in-scope step succeeding in one chained run, with smoke tests passed and every output hashed"
  sandbox-validated: "every in-scope output matching its legacy reference, a full chained run and a strong read record"
  reference-verified: "the target job files generated, checked offline and sealed into the evidence"
  target-ready: "nothing the plugin computes: deployed, live-target-verified and customer-accepted are never computed"

# --- short glossary at the end of the report
glossary:
  rung: "a step of the status ladder: generated, sandbox-validated, reference-verified, target-ready. ladder.py computes it from the sealed evidence; nobody types it."
  legacy reference: "the file the old workflow produced, which the new output is compared with."
  chained run: "the new pipeline run end to end, each step reading the new outputs of the steps before it. Only a chained run can be verified."
  PASS_EXACT: "the new output is identical to the legacy reference on every check."
  PASS_WITHIN_TOLERANCE: "the new output differs from the legacy reference only within a tolerance a person signed."
  NEEDS_DECISION: "the difference would be within a proposed tolerance or known difference that nobody has signed. Only a person can decide."
  NEEDS_REVIEW: "a person must look at the pictures (a visual flag) or a visual review receipt is missing."
  NOT_COMPARED: "a legacy reference exists but no comparison was made."
  NO_REFERENCE: "the old workflow left no file to compare with, so the output is neither confirmed nor refuted."
  ACCEPTED_DIFFERENCE: "a difference a person accepted as a known difference. Shown amber, never green: the comparison itself still fails."
  tolerance: "the largest difference that still counts as the same result, measured from two numbers: how far correct implementations spread and how close the nearest wrong one comes."
  evidence id: "the hash of the sealed evidence index of a run. Every number in this report comes from the bundle with this id."
  sealed: "the run's evidence was hashed and made read-only. A later change to any file is detected."
